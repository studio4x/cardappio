
[functions.get-invoice-url]
enabled = true
verify_jwt = false
import_map = "./functions/get-invoice-url/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/get-invoice-url/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/get-invoice-url/*.html" ]

[functions.import-recipe-draft]
enabled = true
# Server-to-server authentication is enforced in the function with HMAC,
# timestamp and a one-time nonce. Supabase JWT verification is intentionally
# disabled because n8n does not receive a Supabase user or service-role token.
verify_jwt = false
entrypoint = "./functions/import-recipe-draft/index.ts"

[functions.import-recipe-draft-v2]
enabled = true
# V2 preserves the HMAC/replay contract and accepts any active recipe category.
verify_jwt = false
entrypoint = "./functions/import-recipe-draft-v2/index.ts"

[functions.recipe-import-reference-data]
enabled = true
# Read-only server-to-server endpoint. Authentication and replay protection use
# the same HMAC/timestamp/nonce contract as import-recipe-draft.
verify_jwt = false
entrypoint = "./functions/recipe-import-reference-data/index.ts"

[functions.recipe-import-candidate-status]
enabled = true
# Read-only server-to-server preflight for duplicate candidate URLs.
verify_jwt = false
entrypoint = "./functions/recipe-import-candidate-status/index.ts"

[functions.recipe-automation-runtime]
enabled = true
# n8n scheduler/runtime endpoint authenticated by HMAC, timestamp and nonce.
verify_jwt = false
entrypoint = "./functions/recipe-automation-runtime/index.ts"

[functions.recipe-automation-admin]
enabled = true
# Browser/admin endpoint. Requires a valid Supabase JWT and admin/super_admin role.
verify_jwt = true
entrypoint = "./functions/recipe-automation-admin/index.ts"
